# nginx reverse proxy in front of the gunicorn app container.
#
# Plain HTTP only. On a real VM, TLS would be added in this file: a second
# server block with "listen 443 ssl;", ssl_certificate and ssl_certificate_key
# (for example from Let's Encrypt), and a redirect from port 80 to 443.
# The certificate files would be mounted into the nginx container read-only,
# and port 443 would be published in docker-compose.yml.

# WebSocket apps (such as Shiny) need this map, used by the commented
# "Connection" header in the location block below.
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;

    location / {
        # "app" is the Compose service name, resolved on the Compose network.
        proxy_pass http://app:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # WebSocket apps (such as Shiny) also need the lines below. Long timeouts
        # keep idle sessions open, and buffering off streams updates immediately.
        # proxy_set_header Upgrade    $http_upgrade;
        # proxy_set_header Connection $connection_upgrade;
        # proxy_read_timeout 1d;
        # proxy_send_timeout 1d;
        # proxy_buffering off;
    }
}
